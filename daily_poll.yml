name: Daily Data Poll

# ── WHY THIS EXISTS ──────────────────────────────────────────────────────────
# The ETF shares-outstanding poll records data that CANNOT BE BACKFILLED at any
# price — free sources expose shares outstanding only as a current snapshot.
#
# Running it inside the Streamlit app was wrong for two reasons:
#   1. Streamlit Community Cloud's filesystem is EPHEMERAL — the history you
#      cannot recreate would be wiped on every redeploy, restart, and sleep.
#   2. It only ran when somebody happened to open the app. Miss a week of
#      opening the dashboard and you miss a week of unrecoverable history.
#
# A scheduled Action fixes both: it runs whether or not anyone opens the app,
# and it commits to the repo, which is durable and versioned. The poll is a
# data job, not a UI concern.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 21:30 UTC = 4:30pm ET, ~30 min after the US close. Weekdays only.
    # NOTE: GitHub's scheduler is best-effort and can lag under load; a missed
    # run is a one-day gap, which the flow calculation tolerates (it uses
    # rolling sums with min_periods, not a strict daily sequence).
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # manual trigger for backfill-from-today or testing

permissions:
  contents: write           # required to commit the data files

concurrency:
  group: daily-poll
  cancel-in-progress: false # never abandon a partially-written data commit

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Poll ETF shares outstanding
        env:
          ETF_FLOW_STORE: data/etf_shares_history.csv
        run: |
          python - <<'PY'
          import sys, traceback
          sys.path.insert(0, ".")
          try:
              from etf_flow_tracker import snapshot_all, coverage_report
              snapshot_all()
              print("coverage:", coverage_report().get("message"))
          except Exception:
              traceback.print_exc()
              # Do NOT fail the workflow on a partial fetch — a vendor hiccup
              # should not stop tomorrow's run from being scheduled.
              print("::warning::Poll failed; see traceback above.")
          PY

      - name: Verify data actually changed
        id: check
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new data — skipping commit (avoids empty-commit noise)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: daily ETF shares snapshot $(date -u +%Y-%m-%d)"
          # Rebase in case a concurrent run or manual commit landed first
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
