name: EDGAR Probe

# SEC EDGAR data probe (edgar_probe.py). Manual only.
# Can free SEC data support track A (earnings acceleration) and track B
# (insider cluster buying) without hindsight? Maps past S&P 500 members to SEC
# company numbers from the quarterly insider data sets, counts insider buying
# clusters, and samples point-in-time quarterly EPS and revenue.
# Needs the repository secret SEC_CONTACT_EMAIL (the SEC requires a contact
# email in the User-Agent). The email is never printed or committed.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python edgar_probe.py --selftest
      - name: Run the probe
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python edgar_probe.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in data/edgar logs/edgar; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "edgar probe: $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
      - name: Publish to the run page
        if: always()
        run: |
          if [ -f logs/edgar/probe_report.md ]; then cat logs/edgar/probe_report.md >> "$GITHUB_STEP_SUMMARY"; fi
