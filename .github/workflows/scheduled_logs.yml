name: Scheduled Checklist Logs

# ─────────────────────────────────────────────────────────────────────────────
#  DST-AWARE SCHEDULING
# ─────────────────────────────────────────────────────────────────────────────
#  GitHub Actions cron is UTC-only and has no timezone support, so a single
#  fixed cron drifts by an hour twice a year. The fix is to fire at BOTH the
#  EDT and EST equivalents and let the job itself check the real Eastern time,
#  exiting early when it is the wrong one. Two triggers, one effective run.
#
#  DAILY — 6:30 PM ET  (not 5:00 PM; see auto_log.py for the full rationale)
#     One hour after the close is too early for the inputs this log depends on.
#     Treasury H.15 posts ~4:15pm ET and takes time to reach FRED; ETF issuer
#     shares files land 6-9pm ET. A 5:00pm run would routinely capture the
#     PREVIOUS day's Treasury values while stamping them with today's date —
#     a silent off-by-one that corrupts every momentum calculation built on
#     the history. 6:30pm clears all sources with margin, same evening.
#       22:30 UTC = 6:30 PM EDT (Mar-Nov)
#       23:30 UTC = 6:30 PM EST (Nov-Mar)
#
#  WEEKLY — Sunday 6:00 AM ET  (as requested; well chosen and unchanged)
#     Falls after the COT release (Friday 3:30pm ET) and before the week
#     begins, which is exactly what Checklist v4 Weekly Step 5 requires.
#       10:00 UTC = 6:00 AM EDT
#       11:00 UTC = 6:00 AM EST
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '30 22 * * 1-5'   # daily, EDT
    - cron: '30 23 * * 1-5'   # daily, EST
    - cron: '0 10 * * 0'      # weekly, EDT
    - cron: '0 11 * * 0'      # weekly, EST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which log to run'
        required: true
        default: 'daily'
        type: choice
        options: [daily, weekly]

concurrency:
  group: scheduled-logs
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # v2 gate — window-based, not exact-hour. GitHub documents that
      # scheduled workflows can be delayed, sometimes significantly, during
      # platform load. The original gate required hour == 18 EXACTLY for
      # daily; on 2026-08-12 GitHub delayed the 22:30 UTC trigger to ~7:30pm
      # ET and the 23:30 UTC twin to ~8:04pm ET — both landed outside their
      # single-hour windows, and the ENTIRE DAY silently produced no log,
      # with both runs showing a misleading green "Success" (the workflow
      # correctly did nothing, which looks identical to correctly doing
      # something from the run list alone).
      #
      # Fix: accept ANY firing from the window's start onward (18:00+ ET
      # weekdays, 06:00+ ET Sunday), gated on whether today's/this week's
      # report has already been written. This self-heals against arbitrary
      # delay — whichever trigger fires first after the window opens does the
      # real work; a later trigger that day finds the report already exists
      # and stands down rather than running (and committing) a second time.
      - name: Decide whether this run should proceed
        id: gate
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, '.')
          import market_time as mt

          dispatch = "${{ github.event_name }}" == "workflow_dispatch"
          mode_in  = "${{ github.event.inputs.mode }}" or "daily"
          now = mt.now_et()
          hour, dow = now.hour, now.weekday()   # Mon=0 .. Sun=6

          daily_report = f"logs/summaries/{now.date().isoformat()}_daily.md"

          if dispatch:
              proceed, mode, why = True, mode_in, f"manual dispatch ({mode_in})"
          elif dow == 6:  # Sunday — weekly window
              if hour < 6:
                  proceed, mode, why = False, "weekly", (
                      f"before the weekly window (06:00 ET), now "
                      f"{now:%H:%M} ET")
              else:
                  # Any weekly summary written TODAY counts as "already ran" —
                  # simpler and sufficient since the weekly window is a single
                  # Sunday, unlike daily which must key across weekday dates.
                  already = os.path.exists(
                      f"logs/summaries/{now.date().isoformat()}_weekly.md")
                  if already:
                      proceed, mode, why = False, "weekly", (
                          "this week's report already exists — an earlier "
                          "trigger already ran")
                  else:
                      proceed, mode, why = True, "weekly", (
                          f"first trigger in the weekly window "
                          f"({now:%H:%M} ET)")
          elif dow < 5:  # weekday — daily window
              if hour < 18:
                  proceed, mode, why = False, "daily", (
                      f"before the daily window (18:00 ET), now "
                      f"{now:%H:%M} ET")
              elif not mt.is_trading_day(now.date()):
                  proceed, mode, why = False, "daily", (
                      f"{now.date()} is a market holiday")
              elif os.path.exists(daily_report):
                  proceed, mode, why = False, "daily", (
                      "today's report already exists — an earlier trigger "
                      "already ran")
              else:
                  proceed, mode, why = True, "daily", (
                      f"first trigger in the daily window ({now:%H:%M} ET)")
          else:
              proceed, mode, why = False, "daily", "weekend, non-trading"

          print(f"::notice::{'RUN' if proceed else 'SKIP'} — {why}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if proceed else 'false'}\n")
              f.write(f"mode={mode}\n")
              f.write(f"et={now:%Y-%m-%d %H:%M %Z}\n")
          PY

      - name: Run the checklist log
        if: steps.gate.outputs.proceed == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # A manual workflow_dispatch already told the gate step above to
          # proceed regardless of day — but that permission has to reach
          # auto_log.py itself too, or a Sunday test run silently no-ops
          # (writes zero files) and the commit step below then fails trying
          # to `git add` a logs/ directory that was never created. A
          # scheduled cron run never sets this, so production behavior on
          # real weekends/holidays is unchanged.
          LOG_FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python -c "import os; k=os.environ.get('FRED_API_KEY',''); print(f'FRED_API_KEY: {\"SET, \" + str(len(k)) + \" chars\" if k else \"EMPTY — not reaching this environment\"}')"
          echo "Eastern time: ${{ steps.gate.outputs.et }}"
          python auto_log.py ${{ steps.gate.outputs.mode }}

      - name: Commit logs
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # GUARD: logs/ may legitimately not exist — a non-forced daily run
          # on a real holiday the calendar caught, or ANY crash in the
          # previous step before a single file was written, both leave
          # nothing on disk. `git add -A logs/` on a nonexistent path is a
          # FATAL pathspec error that red-X's the whole job even though
          # "nothing to commit" is not actually a failure. Check existence
          # first and exit cleanly rather than let git decide that for us.
          if [ ! -d logs ]; then
            echo "No logs/ directory was produced this run — see the 'Run "
            echo "the checklist log' step above for why (commonly: today is "
            echo "not a trading day and this was not a forced run). Nothing "
            echo "to commit; this is not a failure."
            exit 0
          fi

          # `git add` FIRST, then check the staged index. `git diff` alone only
          # sees TRACKED files, so on the first run the brand-new logs/ files
          # are invisible to it and the commit is skipped — permanently, since
          # they never become tracked. Same deadlock that blocked the ETF
          # poller for months.
          git add -A logs/
          if git diff --cached --quiet -- logs/; then
            echo "No new log data — nothing staged."
          else
            git commit -m "logs: ${{ steps.gate.outputs.mode }} checklist ${{ steps.gate.outputs.et }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
            echo "Committed:"
            git show --stat --oneline HEAD | tail -n +2
          fi

      - name: Publish summary to the run page
        if: steps.gate.outputs.proceed == 'true'
        run: |
          LATEST=$(ls -t logs/summaries/*.md 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            cat "$LATEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary file produced." >> "$GITHUB_STEP_SUMMARY"
          fi
