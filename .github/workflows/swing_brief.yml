name: Swing Desk Brief

# Runs AFTER the daily checklist log (6:30 PM ET) so both bridges have
# published for the day. Same DST twin-cron pattern as scheduled_logs.yml:
#   22:45 UTC = 6:45 PM EDT   23:45 UTC = 6:45 PM EST
# The gate accepts any firing from 18:00 ET onward on a trading day and
# stands down if a brief was already written from within the window.
#
# This job WRITES A BRIEF AND NOTHING ELSE. It never touches
# data/swing_journal.csv -- decisions come only from the tab or chat.

on:
  schedule:
    - cron: '45 22 * * 1-5'
    - cron: '45 23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: swing-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gate
        id: gate
        run: |
          python - <<'PY'
          import os, json, sys
          sys.path.insert(0, '.')
          import market_time as mt
          dispatch = "${{ github.event_name }}" == "workflow_dispatch"
          now = mt.now_et(); d = now.date().isoformat()
          meta = f"logs/swing/{d}_brief.meta.json"
          def done():
              try: return int(json.load(open(meta)).get("et_hour", -1)) >= 18
              except Exception: return False
          if dispatch:               proceed, why = True, "manual dispatch"
          elif now.weekday() >= 5:   proceed, why = False, "weekend"
          elif not mt.is_trading_day(now.date()): proceed, why = False, "holiday"
          elif now.hour < 18:        proceed, why = False, f"before window ({now:%H:%M} ET)"
          elif done():               proceed, why = False, "brief already written from within the window"
          else:                      proceed, why = True, f"first trigger in window ({now:%H:%M} ET)"
          print(f"::notice::{'RUN' if proceed else 'SKIP'} — {why}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if proceed else 'false'}\net={now:%Y-%m-%d %H:%M %Z}\n")
          PY

      - name: Build the brief
        if: steps.gate.outputs.proceed == 'true'
        env:
          DATA_DIR: data
        run: python swing_agent.py

      - name: Commit the brief
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d logs/swing ] || { echo "no brief produced"; exit 0; }
          git add -A logs/swing/
          git diff --cached --quiet -- logs/swing/ && echo "nothing new" || {
            git commit -m "swing: brief ${{ steps.gate.outputs.et }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          }
