name: ROT3 Lab

# Track D: ROT3 sector leadership rotation (rot3_lab.py). Manual only.
# Use A: ROT3 as O11's Offense book. Use B: ROT3 for the swing book's idle cash.
# Rules and bars are pre-registered in claude/rot3_lab_2026-11-20.md.
# Selftest first; a failing selftest stops the run before anything is written.

on:
  workflow_dispatch:

concurrency:
  group: rot3-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python rot3_lab.py --selftest
      - name: Run the ROT3 lab
        run: python rot3_lab.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rot3_lab/ logs/rot3_lab/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "rot3 lab: report $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
      - name: Publish to the run page
        run: |
          if [ -f logs/rot3_lab/latest.md ]; then cat logs/rot3_lab/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
