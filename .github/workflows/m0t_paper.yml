name: M0-T Paper Record

# Swing book, paper only: the forward record of M0-T on a $10,000 paper account from 2026-12-01
# (m0t_paper.py; Matt 2026-11-23). Runs after every Consolidated Daily Brief and by hand.
# Idempotent: the ledger is recomputed from 2026-12-01 each run; orders_seen.csv is append-only.
# Before 2026-12-01 it shows a preview (tonight's orders, empty account).

on:
  workflow_run:
    workflows: ["Consolidated Daily Brief"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: m0t-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python m0t_paper.py --selftest
      - name: Book the M0-T paper record
        run: |
          git pull --ff-only origin main || true
          python m0t_paper.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/m0t_paper/ logs/m0t_paper/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "m0t paper: $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              sleep 5
            done
            if [ "$pushed" != 1 ]; then echo "::error::push failed after 3 attempts; results were NOT saved"; exit 1; fi
          fi
      - name: Publish to the run page
        run: |
          if [ -f logs/m0t_paper/latest.md ]; then cat logs/m0t_paper/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
