name: G Lab

# Long-term book: graduated Defense (g_lab.py) on the 1928–62 hold-out plus 1963–99 and 2000–26 guards. Free data: Ken French, FRED DGS10 (API), datahub gold, Yahoo.
# Manual only. Rules and bars are pre-registered in claude/g_lab_2026-11-25.md.
# Selftest first; a failing selftest stops the run before anything is written.

on:
  workflow_dispatch:

concurrency:
  group: g-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python g_lab.py --selftest
      - name: Run the G lab
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python g_lab.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/g_lab/ logs/g_lab/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "g lab: report $(date -u +%Y-%m-%d)"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              sleep 5
            done
            if [ "$pushed" != 1 ]; then echo "::error::push failed after 3 attempts; results were NOT saved"; exit 1; fi
          fi
      - name: Publish to the run page
        run: |
          if [ -f logs/g_lab/latest.md ]; then cat logs/g_lab/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
