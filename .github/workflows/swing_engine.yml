name: Swing Engine Book

# The $10,000 swing account mirrors the O11 model book (swing_engine.py; Matt 2026-11-22).
# Runs after every Consolidated Daily Brief (idempotent: the paper ledger is recomputed from
# 2026-12-01 each time) and by hand. Before 2026-12-01 it shows a $10k preview only.

on:
  workflow_run:
    workflows: ["Consolidated Daily Brief"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: swing-engine
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python swing_engine.py --selftest
      - name: Book the swing account (paper)
        run: |
          git pull --ff-only origin main || true
          python swing_engine.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing_engine/ logs/swing_engine/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "swing engine: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
      - name: Publish to the run page
        run: |
          if [ -f logs/swing_engine/latest.md ]; then cat logs/swing_engine/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
