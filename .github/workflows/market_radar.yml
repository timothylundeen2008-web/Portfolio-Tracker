name: Market Radar

# ─────────────────────────────────────────────────────────────────────────────
#  Opportunity Radar (market_radar.py). ALERT-ONLY: never changes a book.
#  Every weekday after the close: the PULSE (engine closes, multi-day index
#  moves, biggest movers). Monday, Wednesday and Friday: the full SCAN of ~95
#  ETFs with new-leader / breakdown flags, scored forward against SPY.
#  A GitHub issue that @mentions you is opened only for ALERT/WARN findings.
#  22:20 UTC = 5:20 PM EST / 6:20 PM EDT. The script skips non-trading days.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '20 22 * * 1-5'
  workflow_dispatch:
    inputs:
      scan:
        description: 'Run the full scan today'
        type: boolean
        default: true

concurrency:
  group: market-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Trading day?
        id: gate
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, '.')
          import market_time as mt
          now = mt.now_et()
          manual = "${{ github.event_name }}" == "workflow_dispatch"
          ok = mt.is_trading_day(now.date()) or manual
          print(f"::notice::{'RUN' if ok else 'SKIP'} — {now.date()}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if ok else 'false'}\n")
          PY

      - name: Install (minimal)
        if: steps.gate.outputs.proceed == 'true'
        run: pip install yfinance pandas numpy requests

      - name: Selftest (offline)
        if: steps.gate.outputs.proceed == 'true'
        run: python market_radar.py --selftest

      - name: Radar
        if: steps.gate.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scan }}" = "true" ]; then
            python market_radar.py --scan
          else
            python market_radar.py
          fi

      - name: Commit results
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in data/radar logs/radar; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "market radar: $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
