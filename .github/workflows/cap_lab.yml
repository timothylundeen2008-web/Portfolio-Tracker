name: Capacity Lab

# Swing book: M0-T with leveraged twins and more slots (swing trials 99 -> 104).
# Manual only. Rules and bars are pre-registered in claude/cap_lab_2026-11-25.md.
# Selftest first; a failing selftest stops the run before anything is written.

on:
  workflow_dispatch:

concurrency:
  group: cap-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python cap_lab.py --selftest
      - name: Run the capacity lab
        id: run
        run: python cap_lab.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cap_lab/ logs/cap_lab/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "cap lab: report $(date -u +%Y-%m-%d)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then echo "::error::push failed after 3 tries; results are only on the run page"; exit 1; fi
          fi
      - name: Publish to the run page
        if: always()
        run: |
          if [ "${{ steps.run.outcome }}" = "success" ] && [ -f logs/cap_lab/latest.md ]; then
            cat logs/cap_lab/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Capacity lab did not complete (run step: ${{ steps.run.outcome }}). No report; see the log." >> "$GITHUB_STEP_SUMMARY"
          fi
