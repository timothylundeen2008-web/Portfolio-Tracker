name: Regime Classifier Probe

# Data probe for the regime classifier replay (plan item 4, N11). Looks at no returns.
# Manual only. Selftest first; a failing selftest stops the run before anything is written.

on:
  workflow_dispatch:

concurrency:
  group: rc-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python rc_probe.py --selftest
      - name: Run the probe
        id: run
        timeout-minutes: 20
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python rc_probe.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rc_probe/ logs/rc_probe/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "rc probe: report $(date -u +%Y-%m-%d)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then echo "::error::push failed after 3 tries; results are only on the run page"; exit 1; fi
          fi
      - name: Publish to the run page
        if: always()
        run: |
          if [ "${{ steps.run.outcome }}" = "success" ] && [ -f logs/rc_probe/latest.md ]; then
            cat logs/rc_probe/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Probe did not complete (run step: ${{ steps.run.outcome }}). No report; see the log." >> "$GITHUB_STEP_SUMMARY"
          fi
