# Refine Lab — development/holdout test of rule changes to the M0 and M1 stock
# setups (refine_lab.py): rules chosen on 2017-21, judged once on 2022+. Swing book only.
# Manual only: Actions tab → "Refine Lab" → Run workflow. Allow up to 90 minutes.
# Runs the offline selftest first and stops if it fails, so a broken harness
# can never commit a report. Commits data/refine_lab/, logs/refine_lab/ and the
# sector lookup cache. Reads data/universe/sp500_membership.csv (universe probe).
name: Refine Lab

on:
  workflow_dispatch:

concurrency:
  group: refine-lab
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Selftest (offline)
        run: python refine_lab.py --selftest

      - name: Run the refine lab
        run: python refine_lab.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # one path per command: `git add a b` stages nothing when any one path is missing
          for p in data/refine_lab logs/refine_lab data/universe/sector_cache.csv; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "refine lab: report $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi

      - name: Publish to the run page
        run: |
          LATEST=$(ls -t logs/refine_lab/*_report.md 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then cat "$LATEST" >> "$GITHUB_STEP_SUMMARY"; fi
