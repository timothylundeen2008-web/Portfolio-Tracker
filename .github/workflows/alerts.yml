name: Alerts

# ─────────────────────────────────────────────────────────────────────────────
#  Phone alerts (risk_policy.md §9). Build #3, 2026-11-12.
#  Runs after the Consolidated Daily Brief (which runs after the Swing Desk
#  Brief), so it reads the night's final outputs. alerts.py opens one GitHub
#  issue per live condition with an @mention; the GitHub mobile app pushes it.
#  It closes the issue itself when the condition clears.
#    • workflow_run — after every "Consolidated Daily Brief" completion
#      (idempotent: a live condition never opens a second issue)
#    • fallback cron 03:40 UTC (11:40 PM EDT / 10:40 PM EST), weekday sessions
#    • workflow_dispatch — tick "test" to open a [TEST] issue and confirm the
#      push reaches the phone; the next normal run closes it
#  Stdlib only: no pip install. The selftest runs inside alerts.py on every
#  run; a failing selftest raises its own ALARM issue instead of going silent.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["Consolidated Daily Brief"]
    types: [completed]
  schedule:
    - cron: '40 3 * * 2-6'
  workflow_dispatch:
    inputs:
      test:
        description: "Open a [TEST] issue to confirm the phone push"
        type: boolean
        default: false

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main              # workflow_run would otherwise check out the triggering SHA

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Evaluate and sync issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --ff-only origin main || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python alerts.py --test
          else
            python alerts.py
          fi

      - name: Commit summary
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A logs/alerts/ || true
          git diff --cached --quiet -- logs/alerts/ && echo "nothing new" || {
            git commit -m "alerts: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          }
