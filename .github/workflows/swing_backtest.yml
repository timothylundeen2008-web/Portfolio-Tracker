# Swing Backtest — historical test of the end-of-day, long-only swing setups
# (swing_backtest.py). Manual only: Actions tab → "Swing Backtest" → Run workflow.
# Runs the offline selftest first and stops if it fails, so a broken harness
# can never commit a report. Commits data/swing_backtest/ and logs/swing_backtest/.
name: Swing Backtest

on:
  workflow_dispatch:

concurrency:
  group: swing-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Selftest (offline)
        run: python swing_backtest.py selftest

      - name: Run the backtest
        run: python swing_backtest.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing_backtest/ logs/swing_backtest/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "swing backtest: report $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Publish to the run page
        run: |
          LATEST=$(ls -t logs/swing_backtest/*_report.md 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then cat "$LATEST" >> "$GITHUB_STEP_SUMMARY"; fi
