name: Insider Lab

# Track B: insider cluster buying (insider_lab.py). Manual only.
# Reads the committed SEC data set (data/edgar, built by EDGAR Data) and prices
# from Yahoo. Rules and bar are pre-registered in claude/insider_lab_2026-11-20.md.
# Selftest first; a failing selftest stops the run before anything is written.

on:
  workflow_dispatch:

concurrency:
  group: insider-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python insider_lab.py --selftest
      - name: Run the insider lab
        run: python insider_lab.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insider_lab/ logs/insider_lab/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "insider lab: report $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
      - name: Publish to the run page
        run: |
          if [ -f logs/insider_lab/latest.md ]; then cat logs/insider_lab/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
