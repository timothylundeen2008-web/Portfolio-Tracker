name: Engine Shadow

# Forward record of the frozen Offense/Balanced/Defense engines (engine_shadow.py).
# Runs after every Consolidated Daily Brief (idempotent: the whole record is
# recomputed from prices each time), and by hand. Books nothing before
# 2026-12-01; until then it reports what each engine says.

on:
  workflow_run:
    workflows: ["Consolidated Daily Brief"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: engine-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python engine_shadow.py --selftest
      - name: Book the shadow
        run: |
          git pull --ff-only origin main || true
          python engine_shadow.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/engine_shadow/ logs/engine_shadow/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "engine shadow: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
      - name: Publish to the run page
        run: |
          if [ -f logs/engine_shadow/latest.md ]; then cat logs/engine_shadow/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
