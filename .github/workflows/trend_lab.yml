name: Trend Lab

# Swing book: S3 (leveraged trend, 3x SPY/QQQ) and S4 (bear failed rally, inverse 3x).
# Manual only. Rules and bars are pre-registered in claude/trend_lab_2026-11-21.md.
# Selftest first; a failing selftest stops the run before anything is written.

on:
  workflow_dispatch:

concurrency:
  group: trend-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python trend_lab.py --selftest
      - name: Run the trend lab
        run: python trend_lab.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trend_lab/ logs/trend_lab/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "trend lab: report $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
      - name: Publish to the run page
        run: |
          if [ -f logs/trend_lab/latest.md ]; then cat logs/trend_lab/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
