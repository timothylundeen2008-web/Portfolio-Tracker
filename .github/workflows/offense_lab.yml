name: Offense Lab

# Offense / Balanced / Defense engine battle test (offense_lab.py).
# Manual only: Actions -> Offense Lab -> Run workflow. Selftest first; a failing
# selftest stops the run before anything is written.

on:
  workflow_dispatch:

concurrency:
  group: offense-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Selftest (offline)
        run: python offense_lab.py --selftest
      - name: Run the offense lab
        run: python offense_lab.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/offense_lab/ logs/offense_lab/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "offense lab: report $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              sleep 5
            done
          fi
      - name: Publish to the run page
        run: |
          LATEST=$(ls -t logs/offense_lab/*_report.md 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then cat "$LATEST" >> "$GITHUB_STEP_SUMMARY"; fi
